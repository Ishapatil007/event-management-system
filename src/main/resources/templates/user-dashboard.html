
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Available Events</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 60px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #eee;
        }

        .book-btn {
            display: inline-block;
            background-color: #ddd;
            border: 1px solid #bbb;
            padding: 8px 14px;
            text-decoration: none;
            color: black;
            border-radius: 3px;
            cursor: pointer;
        }

        .book-btn:hover {
            background-color: #ccc;
        }

        .logout {
            text-align: center;
            margin-top: 25px;
        }

        .logout a {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Available Events</h2>

        <table>
            <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Location</th>
                <th>Details</th>
                <th>Actions</th>
            </tr>

            <tr th:each="event : ${events}">

                <td th:text="${event.eventName}"></td>

                <td th:text="${event.date}"></td>

                <td th:text="${event.location}"></td>

                <td th:text="${event.description}"></td>

                <td>
                    <a class="book-btn"
                       th:href="@{/book-event/{eventId}(eventId=${event.id})}">
                        Book Now
                    </a>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(events)}">
                <td colspan="5" style="text-align:center;">
                    No events available currently.
                </td>
            </tr>

        </table>

        <div class="logout">
            <a href="/logout">Log Out</a>
        </div>

    </div>

</body>
</html>
