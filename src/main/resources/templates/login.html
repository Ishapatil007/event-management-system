
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Event Management - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 320px;
            padding: 30px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #ddd;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ccc;
        }

        p {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }

        a {
            color: #555;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <h2>Login</h2>

        <form action="/login" method="post" autocomplete="off">

            <input type="email"
                   name="email"
                   placeholder="Email"
                   autocomplete="off"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   autocomplete="new-password"
                   required>

            <button type="submit">Log In</button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Sign Up</a>
        </p>

        <p th:if="${param.error}">
            Invalid email or password!
        </p>

    </div>

</body>
</html>
