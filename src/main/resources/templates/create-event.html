
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create New Event</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 520px;
            background-color: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #444;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }
        textarea {
            height: 90px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: #ddd;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #ccc;
        }
        .cancel {
            text-align: center;
            margin-top: 15px;
        }
        .cancel a {
            color: #555;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create New Event</h2>
        <form action="/create-event" method="post">
            <label>Event Name:</label>
            <input type="text"
                   name="eventName"
                   required>
            <label>Event Date:</label>
            <input type="date"
                   name="date"
                   required>
            <label>Event Location:</label>
            <input type="text"
                   name="location"
                   required>
            <label>Event Details:</label>
            <textarea name="description"
                      required></textarea>
            <button type="submit">Create Event</button>
        </form>
        <div class="cancel">
            <a href="/admin-dashboard">Cancel</a>
        </div>
    </div>
</body>
</html>
